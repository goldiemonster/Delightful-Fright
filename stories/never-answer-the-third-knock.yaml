# One line = one caption beat + one shot. Aim for 75–90 seconds (about 190–230 words).
# Build the ending first. Give the narrator a goal, a concrete anomaly, two escalating
# discoveries, an active choice, and a revelation the story has earned.
#
# Per line:
#   text:      exactly what the narrator says. Wrap words in *asterisks* to show them in red.
#   scene:     what the frame shows (subject, place, light).
#   camera:    optional, e.g. "low angle close-up", "wide from the doorway".
#   action:    optional, the single physical action in the frame.
#   evidence:  optional, the clue or state that must be visible.
#   visual:    optional, a file in assets/ (e.g. images/my-painting.jpg), or a Pexels search.
#   impact:    true = riser + boom + flash + camera shake when the line starts (the hook always gets one).
#   sfx:       knock | heartbeat | bell | static | whoosh | boom | riser (one or a list)
#   pause:     seconds of silence after the line (silence only: speech is never stretched).
#   move:      push_in | pull_out | drift_left | drift_right | rise | sink (default: varies per shot)

title: Never Answer the Third Knock

# Narrator: Kokoro (free) by default; blend voices with weights.
voice: bm_george:0.7,am_onyx:0.3
speed: 0.9
# Or Cartesia Sonic, as on the channel: set a voice id here and a CARTESIA_API_KEY secret.
# cartesia_voice: your-voice-id

grade: noir        # noir (amber over blue-grey) | amber | cold | green
music: auto        # auto = generated score; or assets/music/your-track.mp3; or none
ambience: room     # room | rain | wind | none
# style: overrides the art direction added to every shot (default: charcoal/graphite ashcan noir)

# Continuity anchors keep faces, rooms and props the same from shot to shot.
# A named anchor is described in every shot whose scene mentions it (so write
# "the narrator ...", "the grandmother's hand ..."); `world` goes into every shot.
anchors:
  narrator: man in his thirties, short dark hair, stubble, grey wool sweater
  grandmother: thin woman in her eighties, white hair in a bun, black cardigan
  world: old isolated farmhouse at night, bare wooden floors, lit by a single oil lamp or moonlight, deep shadows

lines:
  - text: My grandmother had one rule. Never answer the *third* knock.
    scene: the grandmother's hand resting on the brass handle of the oak front door
    camera: tight close-up
    evidence: lamplight on her knuckles
  - text: The first knock is the wind. The second is the house settling.
    scene: the oak front door at the end of the dark hallway, moonlight under the door
    camera: wide from the far end of the hallway
    sfx: knock
  - text: The third is something that *learned* how to knock.
    scene: the outside of the oak door, deep scratch marks in the wood
    camera: extreme close-up
    evidence: three parallel gouges at shoulder height
  - text: She died in March. Last week, I moved into her house.
    scene: the narrator carrying a cardboard box into the dim hallway, her empty rocking chair in the corner
    camera: medium shot from inside the doorway
  - text: Her rule was still taped inside the front door, in her handwriting.
    scene: a yellowed handwritten note taped to the inside of the oak door
    camera: close-up
    evidence: the words never answer the third knock, in shaky handwriting
  - text: Last night, at three in the morning, I heard one knock.
    scene: the narrator lying awake in bed, eyes open, moonlight across the blanket
    camera: overhead
    sfx: knock
    pause: 0.7
  - text: Then two.
    scene: the hallway seen from the bedroom door, the front door far away in darkness
    camera: wide, from the bedroom doorway
    pause: 0.9
  - text: I held my breath, and waited for the third.
    scene: the narrator's face in darkness, half lit by moonlight, holding his breath
    camera: extreme close-up
    sfx: heartbeat
  - text: It never came.
    scene: the oak front door, perfectly still, at the end of the black hallway
    camera: slow wide
    pause: 1.0
  - text: Instead, something dragged itself along the hallway floor.
    scene: the hallway floorboards, fresh drag marks through the dust leading toward the bedroom
    camera: low angle along the floor
    evidence: drag marks ending at the bedroom door
  - text: It stopped outside my bedroom. Then it went *past*.
    scene: the narrator sitting up in bed, staring at the gap under the bedroom door
    camera: medium, from beside the bed
    evidence: a shadow moving across the light under the door
  - text: From inside my closet, I heard my grandmother's voice.
    scene: the tall wardrobe in the bedroom, its door open a crack, total blackness inside
    camera: wide, slightly low
    impact: true
  - text: “Good. You remembered.”
    scene: the grandmother's pale eye visible through the crack of the wardrobe door
    camera: extreme close-up
  - text: “Now open the front door. Quickly. Before it finds the way in.”
    scene: the narrator gripping the bedroom door frame, looking down the hallway toward the front door
    camera: over the shoulder
  - text: I ran for the door. Whatever was outside had stopped knocking.
    scene: the narrator running down the dark hallway toward the oak door
    camera: from behind, low
    action: running, one hand reaching ahead
  - text: I turned the lock. And I pulled it open.
    scene: the narrator's hand turning an old iron key in the oak door's lock
    camera: tight close-up
    action: turning the key
  - text: The porch was empty. Just fog, and her footprints in the mud, leading *away* from the house.
    scene: the empty porch at night in fog, a line of small bare footprints in the mud leading away
    camera: wide from the doorway
    evidence: footprints walking away from the house
  - text: She hadn't been keeping something out.
    scene: the narrator's face in the doorway, lit from behind by the oil lamp, realising
    camera: close-up
    pause: 0.6
  - text: She'd been keeping it *in*.
    scene: the hallway behind the narrator, the wardrobe's black doorway visible at the far end
    camera: wide, looking back into the house
    pause: 0.8
  - text: Behind me, from inside the closet, came the third knock.
    scene: the wardrobe door from inside the bedroom, its door now wide open, something long and pale in the darkness
    camera: slow push toward the wardrobe
    impact: true
    sfx: knock

