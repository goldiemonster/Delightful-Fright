# One line = one caption beat + one shot. Aim for 75–90 seconds (about 190–230 words).
# Build the ending first. Give the narrator a goal, a concrete anomaly, two escalating
# discoveries, an active choice, and a revelation the story has earned.
#
# Per line:
#   text:      exactly what the narrator says. Wrap words in *asterisks* to show them in red.
#   scene:     what the frame shows (subject, place, light).
#   camera:    optional, e.g. "low angle close-up", "wide from the doorway".
#   action:    optional, the single physical action in the frame.
#   evidence:  optional, the clue or state that must be visible.
#   visual:    optional, a file in assets/ (e.g. images/my-painting.jpg), or a Pexels search.
#   plate:     optional, a master painting from `plates:` below. Every shot set in the same room
#              uses the same painting, so the room, light and props never change between shots.
#   frame:     optional with plate: [centre x, centre y, zoom] to cut a closer shot out of it
#              (x and y from 0 to 1 across the painting; zoom 1 = the whole painting).
#   impact:    true = the score drops out, a low swell rises, and the light falters (the hook always gets one).
#   sfx:       knock | creak | swell | bell | static | heartbeat | whoosh | boom | riser (one or a list)
#   pause:     seconds of silence after the line (silence only: speech is never stretched).
#   move:      push_in | pull_out | drift_left | drift_right | rise | sink (default: varies per shot)

title: Never Answer the Third Knock

# Narrator: Kokoro (free) by default; blend voices with weights.
voice: bm_george:0.7,am_onyx:0.3
speed: 0.9
# Or Cartesia Sonic, as on the channel: set a voice id here and a CARTESIA_API_KEY secret.
# cartesia_voice: your-voice-id

grade: channel     # channel (lamp-lit warm over blue-black) | noir | amber | cold | green
music: auto        # auto = generated eerie score; or assets/music/your-track.mp3; or none
ambience: room     # room | rain | wind | none
# The art direction added to every painting (the channel's gritty painted realism, lamp-lit).
style: Warm-toned gritty cinematic digital painting, dark graphic novel realism, richly detailed textured brushwork, warm amber oil-lamp light against deep blue-black shadows, grime and worn wood, low-key lighting, quiet unsettling mood

# Continuity anchors describe people and places in shots that have their own `scene:` prompt.
# For real consistency, use plates (below) instead: AI redraws a face differently every time.
# A named anchor is described in every shot whose scene mentions it (so write
# "the narrator ...", "the grandmother's hand ..."); `world` goes into every shot.
anchors:
  narrator: man in his thirties, short dark hair, stubble, grey wool sweater
  grandmother: thin woman in her eighties, white hair in a bun, black cardigan
  world: old isolated farmhouse at night, bare wooden floors, lit only by warm amber oil lamps, deep shadows

# Master plates: one painting per room, painted once and reused by every shot set there.
# The narrator is first-person: we see his hands (grey wool sleeve) and, once, his silhouette,
# never a full face, so he can't change between shots. `from:` repaints another plate with a
# change (strength 0-1: how much may change), keeping its room and light.
plates:
  hallway:
    seed: 32
    prompt: "Long narrow hallway inside an old isolated farmhouse at night, bare wide-plank wooden floors, dark wood-panelled walls, lit only by warm amber oil lamps, one-point perspective, looking down the hall into the house: an empty wooden rocking chair beside a small table with an oil lamp halfway down, and at the very end of the hall an open bedroom doorway framing a tall dark wooden wardrobe whose two doors stand wide open onto pure pitch blackness, no people"
  door_inside:
    seed: 12
    prompt: "Close view of the inside of a heavy old oak front door in an old isolated farmhouse at night, bare wide-plank wooden floors, dark wood-panelled walls, lit only by warm amber oil lamps: a brass door handle, an old iron key in the lock below it, and a yellowed handwritten paper note taped to the door at eye level. Warm lamplight from the left, deep shadows, no people"
  door_outside:
    seed: 13
    prompt: Outside of a heavy old oak front door at night on a farmhouse porch, three deep parallel scratch gouges torn into the wood at shoulder height, cold fog, a faint warm glow of lamplight under the door, damp porch boards, no people
  porch:
    seed: 32
    prompt: "Looking out from an open farmhouse front doorway at night onto an empty wooden porch, porch steps down to a muddy yard swallowed by thick blue fog, a clear single line of small bare human footprints pressed into the wet mud leading away from the steps into the fog, warm amber lamplight spilling from the doorway across the porch boards, no people"
  bedroom:
    seed: 15
    prompt: "Point of view from a bed in a small farmhouse bedroom at night: a man's hand in a grey wool sweater sleeve resting on the edge of a heavy patchwork quilt in the foreground, an oil lamp burning low on the nightstand at the left, a tall dark wooden wardrobe in the far corner with its doors shut, a closed bedroom door on the right with a thin line of light under it. an old isolated farmhouse at night, bare wide-plank wooden floors, dark wood-panelled walls, lit only by warm amber oil lamps"
  wardrobe_eye:
    seed: 16
    prompt: Extreme close-up of the narrow crack between the doors of a dark wooden wardrobe, total blackness inside, a single pale old woman's eye with a thin white eyebrow staring out from the darkness, wisps of white hair, warm lamplight grazing the wood grain
  silhouette:
    seed: 18
    prompt: "Seen from a foggy farmhouse porch at night: a man's dark silhouette standing in the open front doorway, completely backlit by a warm oil lamp inside, face in total shadow, short hair, sweater, the wood-panelled hallway glowing behind him"
  hall_drag:
    from: hallway
    strength: 0.72
    seed: 21
    prompt: Long narrow farmhouse hallway at night, fresh drag marks smeared through the thick dust on the floorboards, leading along the floor toward the camera, oil lamp, empty rocking chair, oak front door at the end
  bedroom_shadow:
    from: bedroom
    strength: 0.7
    seed: 24
    prompt: farmhouse bedroom at night, the line of light under the closed bedroom door broken by the dark shadow of two feet standing outside, oil lamp, wardrobe, quilt

lines:
  - text: My grandmother had one rule. Never answer the *third* knock.
    plate: door_inside
    frame: [0.4, 0.4, 2.0]
  - text: The first knock is the wind. The second is the house settling.
    plate: hallway
    frame: [0.5, 0.42, 1.35]
    sfx: knock
  - text: The third is something that *learned* how to knock.
    plate: door_outside
    frame: [0.5, 0.35, 1.5]
    move: push_in
  - text: She died in March. Last week, I moved into her house.
    plate: hallway
    move: drift_right
  - text: Her rule was still taped inside the front door, in her handwriting.
    plate: door_inside
    frame: [0.45, 0.4, 1.6]
  - text: Last night, at three in the morning, I heard one knock.
    plate: bedroom
    frame: [0.45, 0.3, 1.8]
    sfx: knock
    pause: 0.7
  - text: Then two.
    plate: hallway
    frame: [0.5, 0.45, 1.8]
    move: push_in
    pause: 0.9
  - text: I held my breath, and waited for the third.
    plate: bedroom
    frame: [0.2, 0.35, 2.2]
    sfx: creak
  - text: It never came.
    plate: hallway
    frame: [0.5, 0.42, 1.15]
    move: pull_out
    pause: 1.0
  - text: Instead, something dragged itself along the hallway floor.
    plate: hall_drag
    frame: [0.5, 0.78, 1.5]
    move: sink
  - text: It stopped outside my bedroom. Then it went *past*.
    plate: bedroom_shadow
    frame: [0.7, 0.32, 2.1]
  - text: From inside my closet, I heard my grandmother's voice.
    plate: bedroom
    frame: [0.38, 0.33, 2.0]
    move: push_in
    impact: true
  - text: “Good. You remembered.”
    plate: wardrobe_eye
    move: push_in
  - text: “Now open the front door. Quickly. Before it finds the way in.”
    plate: bedroom
    frame: [0.78, 0.42, 1.8]
  - text: I ran for the door. Whatever was outside had stopped knocking.
    plate: hallway
    frame: [0.45, 0.75, 1.6]
    move: push_in
  - text: I turned the lock. And I pulled it open.
    plate: door_inside
    frame: [0.62, 0.45, 2.0]
  - text: The porch was empty. Just fog, and her footprints in the mud, leading *away* from the house.
    plate: porch
    move: rise
  - text: She hadn't been keeping something out.
    plate: silhouette
    move: push_in
    pause: 0.6
  - text: She'd been keeping it *in*.
    plate: hallway
    frame: [0.52, 0.5, 2.2]
    move: push_in
    pause: 0.8
  - text: Behind me, from inside the closet, came the third knock.
    plate: bedroom
    frame: [0.37, 0.36, 2.3]
    move: push_in
    impact: true
    sfx: knock

