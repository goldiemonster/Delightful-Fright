name: Render Shorts

# Renders automatically when you add or edit a story, on demand from the Actions tab,
# and as a preview on pull requests that change the pipeline or a story.
on:
  push:
    branches: [main]
    paths: ["stories/**.yaml"]
  pull_request:
    paths: ["stories/**.yaml", "pipeline/**", "assets/**", "requirements.txt", ".github/workflows/render.yml"]
  workflow_dispatch:
    inputs:
      story:
        description: "Story file to render (e.g. stories/never-answer-the-third-knock.yaml)"
        required: true
      post:
        description: "Last step: post to YouTube if every QA check passes"
        type: boolean
        default: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick stories to render
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_STORY: ${{ inputs.story }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            files="$INPUT_STORY"
          elif [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=AM "origin/$BASE_REF"...HEAD -- 'stories/*.yaml' | tr '\n' ' ')
            files="${files:-stories/never-answer-the-third-knock.yaml}"
          else
            files=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'stories/*.yaml' | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Rendering: $files"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - run: pip install -r requirements.txt

      - name: Cache narrator and word-timing models
        uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
          key: kokoro-v1.0-whisper-tiny.en

      - run: python -m pipeline.download_models

      - name: Render
        if: steps.pick.outputs.files != ''
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIHORDE_API_KEY: ${{ secrets.AIHORDE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FILES: ${{ steps.pick.outputs.files }}
          # Only a manual run with "post" ticked posts; story pushes and PR previews just render.
          POST: ${{ github.event_name == 'workflow_dispatch' && inputs.post && '--post' || '' }}
        run: python -m pipeline.render --engine kokoro $POST $FILES

      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.files != ''
        with:
          name: shorts
          path: out/
          retention-days: 14
